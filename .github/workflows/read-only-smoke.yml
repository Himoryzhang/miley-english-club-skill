name: Read-only Smoke Test

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of courses to fetch
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MILEY_BOOKING_URL: ${{ secrets.MILEY_BOOKING_URL }}
      STATE_DIR: ${{ runner.temp }}/miley-english-club-state

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify smoke test secret
        run: |
          if [ -z "${MILEY_BOOKING_URL:-}" ]; then
            echo "Missing repository secret: MILEY_BOOKING_URL" >&2
            exit 1
          fi

      - name: Bind member from booking URL
        run: python scripts/miley_club.py --state-dir "$STATE_DIR" bind-member "$MILEY_BOOKING_URL" --make-default

      - name: Show contracts
        run: python scripts/miley_club.py --state-dir "$STATE_DIR" show-contracts

      - name: List recent courses
        run: python scripts/miley_club.py --state-dir "$STATE_DIR" list-courses --status all --days "${{ inputs.days }}"
